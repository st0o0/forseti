services:
  pihole-alpha:
    image: pihole/pihole:latest@sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be
    container_name: forseti-pihole-alpha
    ports:
      - "18080:80"
      - "15353:53/tcp"
      - "15353:53/udp"
    environment:
      FTLCONF_webserver_api_password: ${PIHOLE_ALPHA_PASSWORD}
      TZ: Europe/Berlin
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          memory: 128M
    networks:
      - forseti-dev
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/admin/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  pihole-beta:
    image: pihole/pihole:latest@sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be
    container_name: forseti-pihole-beta
    ports:
      - "18081:80"
      - "15354:53/tcp"
      - "15354:53/udp"
    environment:
      FTLCONF_webserver_api_password: ${PIHOLE_BETA_PASSWORD}
      TZ: Europe/Berlin
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          memory: 128M
    networks:
      - forseti-dev
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/admin/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  forseti:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forseti
    depends_on:
      pihole-alpha:
        condition: service_healthy
      pihole-beta:
        condition: service_healthy
    volumes:
      - ./forseti.dev.yml:/config/forseti.yml:ro
    environment:
      PIHOLE_ALPHA_PASSWORD: ${PIHOLE_ALPHA_PASSWORD}
      PIHOLE_BETA_PASSWORD: ${PIHOLE_BETA_PASSWORD}
    ports:
      - "9099:9099"
    networks:
      - forseti-dev
    command: ["watch", "--config", "/config/forseti.yml"]

networks:
  forseti-dev:
    driver: bridge
