services:
  pihole-alpha:
    image: pihole/pihole:latest
    container_name: forseti-pihole-alpha
    ports:
      - "8080:80"
      - "15353:53/tcp"
      - "15353:53/udp"
    environment:
      FTLCONF_webserver_api_password: ${PIHOLE_ALPHA_PASSWORD}
      TZ: Europe/Berlin
    networks:
      - forseti-dev

  pihole-beta:
    image: pihole/pihole:latest
    container_name: forseti-pihole-beta
    ports:
      - "8081:80"
      - "15354:53/tcp"
      - "15354:53/udp"
    environment:
      FTLCONF_webserver_api_password: ${PIHOLE_BETA_PASSWORD}
      TZ: Europe/Berlin
    networks:
      - forseti-dev

  forseti:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forseti
    depends_on:
      - pihole-alpha
      - pihole-beta
    volumes:
      - ./forseti.dev.yml:/config/forseti.yml:ro
    environment:
      PIHOLE_ALPHA_PASSWORD: ${PIHOLE_ALPHA_PASSWORD}
      PIHOLE_BETA_PASSWORD: ${PIHOLE_BETA_PASSWORD}
    ports:
      - "9099:9099"
    networks:
      - forseti-dev
    command: ["watch", "--config", "/config/forseti.yml"]

networks:
  forseti-dev:
    driver: bridge
